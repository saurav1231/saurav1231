# Every push to main: run the tests, build the website, then log in to the
# Hostinger VPS over SSH and run deploy/deploy.sh.
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   VPS_HOST     your VPS IP address
#   VPS_USER     ayana
#   VPS_SSH_KEY  private key whose public half is in /home/ayana/.ssh/authorized_keys
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual "Run workflow" button

concurrency: deploy-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API tests (FastAPI)
        working-directory: api
        env:
          TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ayana_test
          JWT_SECRET: ci-secret
        run: |
          pip install -r requirements.txt
          python -m pytest -q
      - name: Analytics tests (Streamlit app)
        working-directory: analytics
        run: |
          pip install -r requirements.txt
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Website builds
        working-directory: client
        run: npm ci && npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the server secrets are set
        id: check
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$HOST" ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "VPS_HOST secret not set yet, skipping deploy"; fi
      - name: Run deploy script on the VPS
        if: steps.check.outputs.ready == 'yes'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: cd /var/www/ayana && bash deploy/deploy.sh
