# /etc/nginx/sites-available/ayana   (replace ayana.travel with your domain)
# Certbot adds the HTTPS lines automatically.
server {
    listen 80;
    listen [::]:80;
    server_name ayana.travel www.ayana.travel;

    root /var/www/ayana/client/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 60m;   # admin uploads several photos at once

    # API -> FastAPI (Uvicorn) on port 8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin analytics (Streamlit) - needs WebSocket headers
    location /insights/ {
        proxy_pass http://127.0.0.1:8501/insights/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Uploaded package photos, served straight from disk
    location /uploads/ {
        alias /var/www/ayana/api/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Long cache for hashed build files
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: every other path returns index.html
    location / {
        try_files $uri /index.html;
    }
}
